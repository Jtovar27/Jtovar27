name: Build profile images

on:
  push:
    branches: [main]
    paths: ["profile-v2/tools/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the font tools
        run: pip install fonttools==4.67.0 brotli==1.2.1 uharfbuzz==0.57.0
      - name: Build the images
        run: python profile-v2/tools/build_assets.py
      - name: Commit the images if they changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-v2/assets
          git diff --cached --quiet || (git commit -m "Rebuild profile images" && git push)
