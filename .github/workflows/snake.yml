name: Generate contribution snake

on:
  # Corre solo una vez al día
  schedule:
    - cron: "0 0 * * *"
  # Te deja correrlo a mano desde la pestaña Actions
  workflow_dispatch:
  # Corre cada vez que haces push a main
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write   # necesita escribir en la rama "output"
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # Lee tu gráfica de contribuciones y genera dos SVG (modo claro y oscuro)
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # Colores de RuutDev: culebra azul marino en modo claro, verde lima en modo oscuro
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#00001A
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#CDF98C

      # Sube la carpeta dist/ a una rama separada llamada "output"
      - name: Push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
